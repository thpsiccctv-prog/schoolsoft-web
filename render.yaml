# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Usage:
#   1. Push this schoolsoft_web/ folder to a GitHub repo.
#   2. In Render, "New +" -> "Blueprint" -> pick that repo.
#   3. Render reads this file and creates the web service + free PostgreSQL below.
#   4. After the first deploy, point english-medium.thpsic.com (a subdomain of
#      thpsic.com, which stays on Netlify) at the Render service via CNAME,
#      and add that same hostname as a Custom Domain on the Render service.

# Render Web Service Specification for THPS Intermediate College
services:
  - type: web
    name: thpsic-schoolsoft
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn app:app --timeout 120 --workers 2"
    envVars:
      - key: SCHOOLSOFT_SECRET_KEY
        generateValue: true
      - key: SCHOOLSOFT_DEBUG
        value: "False"
      - key: SCHOOLSOFT_ALLOWED_HOSTS
        value: "thpsic-schoolsoft.onrender.com"
      - key: SCHOOLSOFT_CSRF_TRUSTED_ORIGINS
        value: "https://thpsic-schoolsoft.onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DATABASE_URL
        sync: false
